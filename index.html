<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>거울</title>
<style>
  :root { --bg:#000; --fg:#f2f2f2; --accent:#ffd54a; --panel:rgba(20,20,20,.72); }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden; font-family:-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif; }
  #stage { position:fixed; inset:0; overflow:hidden; }
  video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1) scale(1); transform-origin:center; pointer-events:none; transition:transform .25s ease; }
  #controls { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 20px); transform:translateX(-50%); display:flex; align-items:center; gap:22px; padding:12px 20px; border-radius:999px; background:var(--panel); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); z-index:5; }
  .zoom { display:flex; gap:8px; }
  .zoom button { min-width:56px; height:44px; border:0; border-radius:22px; background:rgba(255,255,255,.12); color:var(--fg); font-size:18px; font-weight:600; }
  .zoom button[aria-pressed="true"] { background:var(--accent); color:#111; }
  .bright { display:flex; align-items:center; gap:10px; }
  .bright svg { width:22px; height:22px; fill:none; stroke:var(--fg); stroke-width:2; stroke-linecap:round; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:200px; height:6px; border-radius:3px; background:rgba(255,255,255,.3); outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:28px; height:28px; border-radius:50%; background:var(--accent); border:0; }
  #msg { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; background:#000; color:#fff; font-size:28px; font-weight:700; text-align:center; padding:24px; }
  #msg.on { display:flex; }
  #start { position:fixed; inset:0; z-index:15; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:#000; text-align:center; padding:24px; }
  #start button { height:56px; padding:0 36px; border:0; border-radius:28px; background:var(--accent); color:#111; font-size:20px; font-weight:700; }
  #start p { margin:0; color:#aaa; font-size:16px; }
  @media print { body { display:none !important; } }
</style>
</head>
<body>
<div id="stage"><video id="cam" autoplay playsinline muted disablepictureinpicture disableremoteplayback controlslist="nodownload noremoteplayback"></video></div>

<div id="controls" hidden>
  <div class="zoom" role="group" aria-label="확대">
    <button data-z="1" aria-pressed="true">1×</button>
    <button data-z="3" aria-pressed="false">3×</button>
    <button data-z="5" aria-pressed="false">5×</button>
  </div>
  <label class="bright">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <input id="bright" type="range" min="20" max="100" value="100" aria-label="밝기">
  </label>
</div>

<div id="start">
  <button id="go">거울 시작</button>
  <p>전면 카메라 사용을 허용해 주세요</p>
</div>

<div id="msg" role="alert">캡처가 불가능한 앱입니다</div>

<script>
(() => {
  const cam = document.getElementById('cam');
  const controls = document.getElementById('controls');
  const start = document.getElementById('start');
  const msg = document.getElementById('msg');
  const slider = document.getElementById('bright');
  let zoom = 1, started = false, msgTimer = null;

  /* 화면 표시 갱신: 확대 + 밝기 */
  function render() {
    cam.style.transform = 'scaleX(-1) scale(' + zoom + ')';
    cam.style.filter = 'brightness(' + (slider.value / 100) + ')';
  }

  /* 전면 카메라 */
  document.getElementById('go').addEventListener('click', async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
      });
      cam.srcObject = stream;
      await cam.play();
      started = true;
      start.remove();
      controls.hidden = false;
      render();
    } catch (e) {
      start.querySelector('p').textContent = '카메라를 사용할 수 없습니다. 설정에서 카메라 권한을 허용해 주세요. (HTTPS 주소에서만 동작합니다)';
    }
  });

  /* 줌 */
  document.querySelectorAll('.zoom button').forEach(b => b.addEventListener('click', () => {
    zoom = Number(b.dataset.z);
    document.querySelectorAll('.zoom button').forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  }));

  /* 밝기 */
  slider.addEventListener('input', render);

  /* 캡처 방지 안내 */
  function blockMsg(hold) {
    if (!started) return;
    msg.classList.add('on');
    clearTimeout(msgTimer);
    if (!hold) msgTimer = setTimeout(() => msg.classList.remove('on'), 2500);
  }
  function clearMsgIfVisible() {
    if (document.visibilityState === 'visible' && document.hasFocus()) {
      clearTimeout(msgTimer);
      msgTimer = setTimeout(() => msg.classList.remove('on'), 1500);
    }
  }

  // 캡처 단축키 (iPadOS 외부 키보드: ⌘⇧3/4/5, PrintScreen 등)
  window.addEventListener('keydown', e => {
    const k = (e.key || '').toLowerCase();
    const shot = k === 'printscreen' || ((e.metaKey || e.ctrlKey) && e.shiftKey && ['3','4','5','s','#','$','%'].includes(k));
    if (shot) { e.preventDefault(); blockMsg(false); }
    if ((e.metaKey || e.ctrlKey) && ['s','p'].includes(k)) { e.preventDefault(); blockMsg(false); }
  }, true);
  window.addEventListener('keyup', e => {
    if ((e.key || '').toLowerCase() === 'printscreen') blockMsg(false);
  }, true);

  // 화면 녹화·미러링·앱 전환 등으로 포커스를 잃는 경우
  document.addEventListener('visibilitychange', () => document.visibilityState === 'hidden' ? blockMsg(true) : clearMsgIfVisible());
  window.addEventListener('blur', () => blockMsg(true));
  window.addEventListener('pagehide', () => blockMsg(true));
  window.addEventListener('focus', clearMsgIfVisible);
  window.addEventListener('beforeprint', () => blockMsg(false));

  // 길게 누르기·우클릭·드래그 저장 차단
  ['contextmenu', 'dragstart', 'selectstart'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
  // 다중 터치 제스처(핀치 확대 등) 차단
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
})();
</script>
</body>
</html>
