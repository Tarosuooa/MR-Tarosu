<style>
  :root { --bg:#000; --fg:#f2f2f2; --accent:#9aa8e6; --on-accent:#141a3d; --panel:rgba(20,20,20,.72); }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden; font-family:-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif; }
  #view { position:fixed; overflow:hidden; left:0; top:0; width:100%; height:100%; background:#000; }
  video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1) scale(2); transform-origin:center; pointer-events:none; }
  #zones { position:fixed; inset:0; display:none; z-index:2; }
  #zones.on { display:grid; }
  #zones div { border:1px solid rgba(255,255,255,.12); }
  #controls { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 20px); transform:translateX(-50%); display:flex; align-items:center; gap:18px; padding:12px 20px; border-radius:999px; background:var(--panel); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); z-index:5; max-width:calc(100% - 24px); }
  .group { display:flex; gap:8px; }
  button { min-width:52px; height:44px; padding:0 8px; border:0; border-radius:22px; background:rgba(255,255,255,.12); color:var(--fg); font-size:18px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; }
  button[aria-pressed="true"] { background:var(--accent); color:var(--on-accent); }
  button svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .bright { display:flex; align-items:center; gap:10px; }
  .bright svg { width:22px; height:22px; fill:none; stroke:var(--fg); stroke-width:2; stroke-linecap:round; }
  input[type=range] { -webkit-appearance:none; appearance:none; width:180px; height:6px; border-radius:3px; background:rgba(255,255,255,.3); outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:28px; height:28px; border-radius:50%; background:var(--accent); border:0; }
  #off { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center; background:#000; }
  #off.on { display:flex; }
  #off button { width:96px; height:96px; border-radius:50%; background:rgba(255,255,255,.1); color:var(--accent); border:2px solid var(--accent); }
  #off button svg { width:40px; height:40px; }
  #menu { position:fixed; inset:0; z-index:15; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; background:#000; text-align:center; padding:24px; }
  #menu.off { display:none; }
  #menu .row { display:flex; gap:8px; }
  #menu button { min-width:52px; height:44px; padding:0 8px; border-radius:22px; background:var(--accent); color:var(--on-accent); font-size:18px; font-weight:600; }
  #hint { margin:0; min-height:22px; color:#aaa; font-size:16px; }
  #msg { position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center; background:#000; color:#fff; font-size:28px; font-weight:700; text-align:center; padding:24px; }
  #msg.on { display:flex; }
  @media print { body { display:none !important; } }
</style>
</head>
<body>
<div id="view"><video id="cam" autoplay playsinline muted disablepictureinpicture disableremoteplayback controlslist="nodownload noremoteplayback"></video></div>
<div id="zones"></div>

<div id="controls" hidden>
  <button id="home" aria-label="처음 화면">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
  </button>
  <div class="group" id="zoomGroup" role="group" aria-label="확대">
    <button data-z="1" aria-pressed="false">1×</button>
    <button data-z="2" aria-pressed="true">2×</button>
    <button data-z="3" aria-pressed="false">3×</button>
    <button data-z="5" aria-pressed="false">5×</button>
  </div>
  <label class="bright">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <input id="bright" type="range" min="20" max="100" value="100" aria-label="밝기">
  </label>
  <button id="close" aria-label="거울 끄기">
    <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </button>
</div>

<div id="off"><button id="on" aria-label="거울 켜기">
  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
</button></div>

<div id="menu">
  <div class="row">
    <button data-s="full">1</button>
    <button data-s="half">1/2</button>
    <button data-s="quarter">1/4</button>
  </div>
  <p id="hint"></p>
</div>

<div id="msg" role="alert">캡처가 불가능한 앱입니다</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cam = $('cam'), view = $('view'), zones = $('zones'), controls = $('controls');
  const menu = $('menu'), off = $('off'), msg = $('msg'), slider = $('bright'), hint = $('hint');
  const layouts = { full:[1,1], half:[2,1], quarter:[2,2] };
  let zoom = 2, split = 'full', active = 0, started = false, stream = null, msgTimer = null;

  function render() {
    cam.style.transform = 'scaleX(-1) scale(' + zoom + ')';
    cam.style.filter = 'brightness(' + (slider.value / 100) + ')';
    const [cols, rows] = layouts[split];
    const w = 100 / cols, h = 100 / rows;
    const c = active % cols, r = Math.floor(active / cols);
    view.style.left = (c * w) + '%'; view.style.top = (r * h) + '%';
    view.style.width = w + '%'; view.style.height = h + '%';
    zones.classList.toggle('on', split !== 'full');
    zones.style.gridTemplateColumns = 'repeat(' + cols + ',1fr)';
    zones.style.gridTemplateRows = 'repeat(' + rows + ',1fr)';
    if (zones.children.length !== cols * rows) {
      zones.innerHTML = '';
      for (let i = 0; i < cols * rows; i++) {
        const d = document.createElement('div');
        d.addEventListener('pointerdown', () => { active = i; render(); });
        zones.appendChild(d);
      }
    }
    document.querySelectorAll('#zoomGroup button').forEach(b => b.setAttribute('aria-pressed', Number(b.dataset.z) === zoom));
  }

  async function openMirror(mode) {
    split = mode; active = 0;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
      });
      cam.srcObject = stream;
      await cam.play();
      started = true;
      hint.textContent = '';
      menu.classList.add('off');
      controls.hidden = false;
      render();
    } catch (e) {
      hint.textContent = '카메라를 사용할 수 없습니다. 설정에서 카메라 권한을 허용해 주세요.';
    }
  }

  function closeMirror() { // 처음 화면(1, 1/2, 1/4)으로
    started = false;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    cam.srcObject = null;
    off.classList.remove('on');
    controls.hidden = true;
    zones.classList.remove('on');
    msg.classList.remove('on');
    menu.classList.remove('off');
  }

  document.querySelectorAll('#menu [data-s]').forEach(b => b.addEventListener('click', () => openMirror(b.dataset.s)));
  $('home').addEventListener('click', closeMirror);

  // X: 거울 전체를 검은색으로 비활성화 / O: 다시 활성화
  $('close').addEventListener('click', () => {
    if (stream) stream.getVideoTracks().forEach(t => t.enabled = false);
    controls.hidden = true; zones.classList.remove('on');
    off.classList.add('on');
  });
  $('on').addEventListener('click', () => {
    if (stream) stream.getVideoTracks().forEach(t => t.enabled = true);
    off.classList.remove('on');
    controls.hidden = false; render();
  });

  document.querySelectorAll('#zoomGroup button').forEach(b => b.addEventListener('click', () => {
    zoom = Number(b.dataset.z); render();
  }));
  slider.addEventListener('input', render);

  /* 캡처 방지 안내 */
  function blockMsg(hold) {
    if (!started) return;
    msg.classList.add('on');
    clearTimeout(msgTimer);
    if (!hold) msgTimer = setTimeout(() => msg.classList.remove('on'), 2500);
  }
  function clearMsgIfVisible() {
    if (document.visibilityState === 'visible' && document.hasFocus()) {
      clearTimeout(msgTimer);
      msgTimer = setTimeout(() => msg.classList.remove('on'), 1500);
    }
  }
  window.addEventListener('keydown', e => {
    const k = (e.key || '').toLowerCase();
    const shot = k === 'printscreen' || ((e.metaKey || e.ctrlKey) && e.shiftKey && ['3','4','5','s','#','$','%'].includes(k));
    if (shot) { e.preventDefault(); blockMsg(false); }
    if ((e.metaKey || e.ctrlKey) && ['s','p'].includes(k)) { e.preventDefault(); blockMsg(false); }
  }, true);
  window.addEventListener('keyup', e => {
    if ((e.key || '').toLowerCase() === 'printscreen') blockMsg(false);
  }, true);
  document.addEventListener('visibilitychange', () => document.visibilityState === 'hidden' ? blockMsg(true) : clearMsgIfVisible());
  window.addEventListener('blur', () => blockMsg(true));
  window.addEventListener('pagehide', () => blockMsg(true));
  window.addEventListener('focus', clearMsgIfVisible);
  window.addEventListener('beforeprint', () => blockMsg(false));

  ['contextmenu', 'dragstart', 'selectstart'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
  ['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
})();
</script>
</body>
</html>
